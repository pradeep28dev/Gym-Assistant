<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trainer sign in | Gym Assistant</title>
    <link rel="stylesheet" href="styles/trainer-base.css">
    <link rel="stylesheet" href="styles/trainer-auth.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-brand">GYM <span>ASSISTANT</span></div>
        <p class="auth-subtitle">Trainer workspace</p>
        <h1>Sign in to continue</h1>
        <div id="loginStatus" class="status" role="alert" aria-live="polite"></div>
        <form id="loginForm" class="auth-form">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button id="togglePassword" class="button secondary small" type="button" aria-label="Show password">Show</button>
                </div>
            </div>
            <button id="loginSubmit" class="button primary" type="submit">Sign in</button>
        </form>
        <p class="auth-note">Trainer accounts only. Contact your gym administrator for access.</p>
    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/trainerApi.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
